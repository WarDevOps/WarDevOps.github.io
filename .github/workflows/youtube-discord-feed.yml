name: YouTube New Video Notifier

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-notify

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: youtube-discord-feed/package-lock.json

      - name: Install dependencies
        working-directory: youtube-discord-feed
        run: npm ci

      - name: Check YouTube channels and notify Discord
        working-directory: youtube-discord-feed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
        run: node ./src/webhookYoutubeRunner.js

      - name: Commit updated video state
        run: |
          git add youtube-discord-feed/data/
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update YouTube feed state"
          git push
